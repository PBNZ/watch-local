name: Integration

# The integration layer needs a provisioned portable runtime (real
# downloads: yt-dlp/ffmpeg/deno/uv binaries + CPU whisper stack + the
# tiny model), so it runs on a schedule + on demand rather than per push.
on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: native workers (ubuntu / pwsh, CPU runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Anonymous huggingface.co downloads from shared runner IPs get
      # 429-rate-limited (2026-07-27 run). Optional secret; empty means
      # anonymous, which the model cache below makes survivable.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ONLY the whisper model (rate-limit-flaky download). The
      # binary downloads stay uncached on purpose: catching a rotted
      # pin is this job's reason to exist.
      - name: Cache whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/watch-local/models
          key: whisper-model-tiny-v1

      - name: Provision portable runtime (CPU, tiny model)
        shell: pwsh
        run: ./plugins/watch-local/scripts/setup.ps1 -Model tiny

      - name: Run integration layer
        shell: pwsh
        run: ./tests/run-tests.ps1 -Integration
